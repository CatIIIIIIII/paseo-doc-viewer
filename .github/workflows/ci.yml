name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  browser:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:browser
        env:
          VIEWER_BROWSER_DIR: ${{ runner.temp }}/viewer-browser

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/viewer-browser/*.png
          if-no-files-found: ignore

  paseo-main:
    name: install on Paseo main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PASEO_SOURCE: ${{ github.workspace }}/paseo
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/checkout@v4
        with:
          repository: getpaseo/paseo
          ref: main
          path: paseo

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            paseo/package-lock.json

      - name: Install Paseo
        working-directory: paseo
        run: npm ci

      - name: Build Paseo protocol and plugin SDK
        working-directory: paseo
        run: npm run build:client && npm run build:plugin

      - name: Check the Paseo checkout is usable
        run: |
          test -f "$PASEO_SOURCE/packages/server/src/server/plugins/compiler.ts"
          test -x "$PASEO_SOURCE/node_modules/.bin/tsx"

      - name: Install plugin with the latest SDK
        working-directory: plugin
        run: |
          npm ci
          npm install --save-dev @getpaseo/plugin@latest

      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck

      - name: Install and icon tests against Paseo main
        working-directory: plugin
        run: npx vitest run --dir test test/s1-install.test.ts test/s10-open-path.test.ts
